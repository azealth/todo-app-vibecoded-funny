<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DayDo</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- ============ PIN screens (lock / first-run creation) ============ -->
    <section id="pin-screen" class="pin-screen" hidden>
      <div class="pin-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 10.5V7.5a5 5 0 0 1 10 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="5" y="10.5" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>
      </div>
      <h1 id="pin-title">Enter your PIN</h1>
      <p id="pin-subtitle" class="pin-subtitle">Unlock DayDo to see today's list.</p>
      <div class="pin-dots" id="pin-dots">
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <p class="pin-error" id="pin-error" hidden>That PIN didn't match. Try again.</p>
      <div class="pin-pad" id="pin-pad">
        <button class="pin-key" data-key="1">1</button>
        <button class="pin-key" data-key="2">2</button>
        <button class="pin-key" data-key="3">3</button>
        <button class="pin-key" data-key="4">4</button>
        <button class="pin-key" data-key="5">5</button>
        <button class="pin-key" data-key="6">6</button>
        <button class="pin-key" data-key="7">7</button>
        <button class="pin-key" data-key="8">8</button>
        <button class="pin-key" data-key="9">9</button>
        <span></span>
        <button class="pin-key" data-key="0">0</button>
        <button class="pin-key pin-key-back" data-key="back" aria-label="Backspace">⌫</button>
      </div>
      <p class="build-tag" id="build-tag"></p>
    </section>

    <!-- ============================ Main view ============================ -->
    <section id="main-view" class="main-view" hidden>
      <header class="topbar">
        <span class="brand">DayDo</span>
        <div class="topbar-actions">
          <button id="sync-btn" class="icon-btn" title="" hidden></button>
          <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5c.04-.33.06-.66.06-1s-.02-.67-.06-1l1.86-1.4a.9.9 0 0 0 .2-1.16l-1.76-3.03a.9.9 0 0 0-1.1-.39l-2.2.87a7.4 7.4 0 0 0-1.73-1l-.33-2.32A.9.9 0 0 0 13.44 3h-2.88a.9.9 0 0 0-.9.77l-.33 2.32c-.62.24-1.2.57-1.73 1l-2.2-.87a.9.9 0 0 0-1.1.4L2.55 9.94a.9.9 0 0 0 .2 1.16L4.6 12.5c-.04.33-.06.66-.06 1s.02.67.06 1l-1.86 1.4a.9.9 0 0 0-.2 1.16l1.76 3.03c.24.4.72.57 1.1.4l2.2-.88c.53.43 1.11.76 1.73 1l.33 2.32c.06.44.46.77.9.77h2.88c.44 0 .82-.33.9-.77l.33-2.32c.62-.24 1.2-.57 1.73-1l2.2.88c.4.16.87 0 1.1-.4l1.76-3.03a.9.9 0 0 0-.2-1.16l-1.86-1.4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
          <button id="lock-btn" class="icon-btn" title="Lock" aria-label="Lock">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 10.5V7.5a5 5 0 0 1 10 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="5" y="10.5" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </div>
      </header>

      <div id="list-scroll" class="list-scroll scrollbar-thin">
        <button id="unfinished-btn" class="unfinished-btn" hidden></button>
        <div id="day-sections"></div>
      </div>

      <button id="fab" class="fab" title="Add a task on any date" aria-label="Add a task">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </section>

    <!-- =================== Unfinished tasks overlay tab =================== -->
    <section id="unfinished-view" class="overlay-view" hidden>
      <header class="topbar">
        <button class="icon-btn back-btn" id="unfinished-back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="brand">Unfinished tasks</span>
        <div class="topbar-actions"></div>
      </header>
      <div id="unfinished-scroll" class="list-scroll scrollbar-thin"></div>
    </section>

    <!-- ============================ Add-task modal ============================ -->
    <div id="add-modal-backdrop" class="modal-backdrop" hidden>
      <div class="modal">
        <h2>Add a task</h2>
        <div class="field">
          <label for="add-modal-text">Task</label>
          <input id="add-modal-text" class="text-input" type="text" placeholder="What needs doing?" maxlength="200" />
        </div>
        <div class="field">
          <label for="add-modal-date">Date</label>
          <input id="add-modal-date" class="text-input" type="date" />
        </div>
        <div class="modal-actions">
          <button id="add-modal-cancel" class="btn">Cancel</button>
          <button id="add-modal-save" class="btn btn-primary">Add task</button>
        </div>
      </div>
    </div>

    <!-- ============================ Task info modal ============================ -->
    <div id="info-modal-backdrop" class="modal-backdrop" hidden>
      <div class="modal">
        <h2 id="info-modal-title">Task details</h2>
        <div class="field">
          <label for="info-modal-desc">Description</label>
          <textarea id="info-modal-desc" class="text-input" rows="4" maxlength="2000" placeholder="Add notes about this task…"></textarea>
        </div>
        <div class="field">
          <label>Links</label>
          <div id="info-modal-links"></div>
          <button id="info-modal-add-link" class="btn-text" type="button">+ Add a link</button>
        </div>
        <div class="modal-actions">
          <button id="info-modal-cancel" class="btn">Cancel</button>
          <button id="info-modal-save" class="btn btn-primary">Save details</button>
        </div>
      </div>
    </div>

  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
